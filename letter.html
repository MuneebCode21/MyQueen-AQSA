<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter</title>
<link rel="icon" type="image/jpeg" href = "images/IMG-20260316-WA0077.jpg">
<meta name="description" content="A small website made for one person.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0:9..144,400;0:9..144,500;0:9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="letter">

<div id="chrome-root"></div>

<noscript>
  <style>
    .reveal{ opacity: 1 !important; transform: none !important; }
    .letter-reading{ opacity: 1 !important; display: flex !important; }
  </style>
  <p class="noscript-note">This little site works best with JavaScript enabled — the envelope on this page needs it to open.</p>
</noscript>

<main>

  <section class="letter-intro" data-envelope>
    <p class="letter-intro__line letter-intro__line--1">There's something I wanted to say properly.</p>
    <p class="letter-intro__line letter-intro__line--2">Open it.</p>

    <div class="envelope">
      <div class="envelope__back"></div>
      <div class="envelope__paper">
        <span class="envelope__paper-label">for you</span>
      </div>
      <div class="envelope__flap"></div>
      <button class="envelope__open" type="button" data-envelope-open aria-label="Open the letter"></button>
    </div>
  </section>

  <section class="letter-reading" data-letter-reading hidden>
    <div class="letter-reading__paper">
      <div class="letter-reading__body" data-letter-body></div>
      <p class="letter-reading__signature" data-letter-signature></p>
    </div>

    <a class="page-continue page-continue--quiet" href="final.html" data-magnetic>
      <span class="page-continue__title">Continue</span>
      <span class="page-continue__arrow" aria-hidden="true"></span>
    </a>
  </section>

</main>

<script src="js/script.js" defer></script>
</body>
</html>
